<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Air Studio - 空中工作室 | 手机端</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --panel: #12121a;
            --border: #1e1e2e;
            --accent: #00d4aa;
            --accent2: #ff6b9d;
            --accent3: #ffb347;
            --text: #e0e0e0;
            --text2: #888;
            --danger: #ff4757;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        /* ============ HEADER ============ */
        .header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.3px;
        }
        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), #00b894);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(0, 212, 170, 0.35);
            animation: pulse-glow 2.5s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 4px 15px rgba(0, 212, 170, 0.35);
            }
            50% {
                box-shadow: 0 4px 28px rgba(0, 212, 170, 0.7);
            }
        }
        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff4757;
            transition: all 0.4s;
            box-shadow: 0 0 8px currentColor;
        }
        .connection-dot.connected {
            background: #00d4aa;
            box-shadow: 0 0 14px #00d4aa;
        }
        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text2);
        }

        /* ============ MAIN LAYOUT ============ */
        .main-container {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
            padding-bottom: 100px;
        }

        /* ============ CARD ============ */
        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s;
        }
        .card.active-recording {
            border-color: var(--danger);
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.25);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.2px;
        }
        .card-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }
        .icon-camera {
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
        }
        .icon-mic {
            background: rgba(255, 107, 157, 0.15);
            color: var(--accent2);
        }
        .icon-motion {
            background: rgba(255, 179, 71, 0.15);
            color: var(--accent3);
        }
        .icon-bilibili {
            background: rgba(0, 161, 214, 0.2);
            color: #00a1d6;
        }

        /* ============ VIDEO PREVIEW ============ */
        .video-preview-wrap {
            position: relative;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/10;
            margin-bottom: 10px;
            border: 2px solid var(--border);
            transition: border-color 0.3s;
        }
        .video-preview-wrap.recording {
            border-color: var(--danger);
            box-shadow: 0 0 20px rgba(255, 71, 87, 0.4);
        }
        .video-preview-wrap video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .recording-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #fff;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .recording-indicator.active {
            opacity: 1;
        }
        .rec-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff4757;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }
        .timer-display {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Courier New', monospace;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .timer-display.active {
            opacity: 1;
        }

        /* ============ BUTTONS ============ */
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 25px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.94);
            transition: transform 0.1s;
        }
        .btn-record {
            background: #ff4757;
            color: #fff;
            box-shadow: 0 4px 18px rgba(255, 71, 87, 0.4);
            flex: 1;
            min-width: 100px;
            justify-content: center;
            font-size: 1rem;
            padding: 14px 20px;
        }
        .btn-record:hover {
            box-shadow: 0 6px 24px rgba(255, 71, 87, 0.6);
        }
        .btn-record.recording {
            background: #fff;
            color: #ff4757;
            box-shadow: 0 4px 24px rgba(255, 255, 255, 0.5);
            animation: pulse-rec 1.2s ease-in-out infinite;
        }
        @keyframes pulse-rec {
            0%,
            100% {
                box-shadow: 0 4px 24px rgba(255, 255, 255, 0.5);
            }
            50% {
                box-shadow: 0 4px 36px rgba(255, 255, 255, 0.85);
            }
        }
        .btn-secondary {
            background: var(--glass);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.06);
        }
        .btn-accent {
            background: var(--accent);
            color: #000;
            font-weight: 700;
            box-shadow: 0 4px 16px rgba(0, 212, 170, 0.35);
        }
        .btn-accent:hover {
            box-shadow: 0 6px 22px rgba(0, 212, 170, 0.55);
        }
        .btn-sm {
            padding: 7px 14px;
            font-size: 0.75rem;
            border-radius: 20px;
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(30%);
        }

        /* ============ MOTION PANEL ============ */
        .motion-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            text-align: center;
        }
        .motion-item {
            background: var(--glass);
            border-radius: var(--radius-sm);
            padding: 10px 6px;
            border: 1px solid var(--border);
        }
        .motion-value {
            font-size: 1.4rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'Courier New', monospace;
            color: var(--accent3);
            letter-spacing: -0.5px;
        }
        .motion-label {
            font-size: 0.65rem;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .motion-bar {
            height: 4px;
            border-radius: 2px;
            background: #2a2a3a;
            margin-top: 6px;
            overflow: hidden;
        }
        .motion-bar-fill {
            height: 100%;
            border-radius: 2px;
            background: var(--accent3);
            transition: width 0.15s ease-out;
        }
        .motion-status {
            font-size: 0.7rem;
            color: var(--text2);
            text-align: center;
            margin-top: 6px;
        }
        .motion-active-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(255, 179, 71, 0.2);
            color: var(--accent3);
            animation: pulse-glow-amber 1.5s ease-in-out infinite;
        }
        @keyframes pulse-glow-amber {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(255, 179, 71, 0.3);
            }
            50% {
                box-shadow: 0 0 18px rgba(255, 179, 71, 0.7);
            }
        }

        /* ============ UPLOAD SECTION ============ */
        .upload-list {
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.78rem;
        }
        .upload-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 4px;
            background: var(--glass);
            gap: 8px;
        }
        .upload-name {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 500;
        }
        .upload-size {
            color: var(--text2);
            font-size: 0.7rem;
            white-space: nowrap;
        }
        .upload-status {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 10px;
            white-space: nowrap;
        }
        .status-ready {
            background: rgba(0, 212, 170, 0.15);
            color: var(--accent);
        }
        .status-uploading {
            background: rgba(255, 179, 71, 0.15);
            color: var(--accent3);
            animation: pulse-glow-amber 1s infinite;
        }
        .status-done {
            background: rgba(0, 212, 170, 0.25);
            color: #00ffcc;
        }

        /* ============ TOAST ============ */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1e1e2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 999;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: var(--accent);
            box-shadow: 0 10px 40px rgba(0, 212, 170, 0.3);
        }
        .toast.error {
            border-color: var(--danger);
            box-shadow: 0 10px 40px rgba(255, 71, 87, 0.3);
        }

        /* ============ RESPONSIVE ============ */
        @media (min-width: 600px) {
            .main-container {
                padding: 20px;
                gap: 16px;
            }
            .btn-record {
                font-size: 1.1rem;
                padding: 16px 24px;
            }
            .video-preview-wrap {
                aspect-ratio: 16/9;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">
            <div class="logo-icon">🌬️</div>
            <span>Air Studio</span>
        </div>
        <div class="header-status">
            <div class="connection-dot" id="connectionDot" title="与电脑的连接状态"></div>
            <span id="connectionText">未连接</span>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-container">

        <!-- AIR CAMERA + AIR MICRO PHONE -->
        <div class="card" id="cameraCard">
            <div class="card-header">
                <div class="card-icon icon-camera">📷</div>
                <span>Air Camera & Air Micro Phone</span>
            </div>
            <div class="video-preview-wrap" id="videoWrap">
                <video id="previewVideo" autoplay playsinline muted></video>
                <div class="recording-indicator" id="recIndicator">
                    <div class="rec-dot"></div> REC
                </div>
                <div class="timer-display" id="timerDisplay">00:00</div>
            </div>
            <div class="btn-row">
                <button class="btn btn-record" id="btnRecord" title="开始/停止录制">
                    ⏺️ 开始录制
                </button>
                <button class="btn btn-secondary btn-sm" id="btnSwitchCamera" title="切换前后摄像头">
                    🔄 翻转
                </button>
                <button class="btn btn-secondary btn-sm" id="btnSnapshot" title="拍摄快照">
                    📸 快照
                </button>
            </div>
            <div style="margin-top:8px;font-size:0.7rem;color:var(--text2);text-align:center;">
                同时采集视频与音频 · 录制保存至电脑
            </div>
        </div>

        <!-- AIR MOTION -->
        <div class="card" id="motionCard">
            <div class="card-header">
                <div class="card-icon icon-motion">🌀</div>
                <span>Air Motion · 动作感应</span>
                <span class="motion-active-badge" id="motionBadge" style="margin-left:auto;"> sensing</span>
            </div>
            <div class="motion-grid">
                <div class="motion-item">
                    <div class="motion-value" id="motionX">0.00</div>
                    <div class="motion-label">X 轴</div>
                    <div class="motion-bar"><div class="motion-bar-fill" id="barX" style="width:50%"></div></div>
                </div>
                <div class="motion-item">
                    <div class="motion-value" id="motionY">0.00</div>
                    <div class="motion-label">Y 轴</div>
                    <div class="motion-bar"><div class="motion-bar-fill" id="barY" style="width:50%"></div></div>
                </div>
                <div class="motion-item">
                    <div class="motion-value" id="motionZ">9.81</div>
                    <div class="motion-label">Z 轴</div>
                    <div class="motion-bar"><div class="motion-bar-fill" id="barZ" style="width:50%"></div></div>
                </div>
            </div>
            <div class="motion-status" id="motionStatus">📱 设备运动数据实时监测中</div>
        </div>

        <!-- BILIBILI UPLOAD -->
        <div class="card" id="bilibiliCard">
            <div class="card-header">
                <div class="card-icon icon-bilibili">📺</div>
                <span>Bilibili 发布</span>
            </div>
            <div class="upload-list" id="uploadList">
                <div style="color:var(--text2);text-align:center;padding:20px;font-size:0.8rem;">
                    录制的视频将出现在这里<br>可上传至 Bilibili
                </div>
            </div>
            <div class="btn-row" style="margin-top:10px;">
                <button class="btn btn-accent btn-sm" id="btnUploadAll" disabled>
                    🚀 上传到 Bilibili
                </button>
                <button class="btn btn-secondary btn-sm" id="btnRefreshList">
                    🔄 刷新列表
                </button>
            </div>
            <div style="margin-top:6px;font-size:0.65rem;color:var(--text2);text-align:center;">
                视频通过电脑端 VB.NET 服务上传至 Bilibili
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        //  Air Studio - 前端核心脚本
        //  功能: Air Camera, Air Micro Phone, Air Motion, Bilibili上传
        //  连接目标: 电脑上的 VB.NET 后端服务
        // ============================================================

        // ---------- 配置 ----------
        const SERVER_URL = localStorage.getItem('air_studio_server') || window.location.origin;
        // 如果通过手机访问电脑服务，需要配置电脑的IP，例如:
        // const SERVER_URL = 'http://192.168.1.100:8899';
        const API_BASE = SERVER_URL + '/api';
        const WS_URL = SERVER_URL.replace(/^http/, 'ws') + '/ws';

        // ---------- 全局状态 ----------
        let mediaStream = null;
        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let recordingStartTime = null;
        let timerInterval = null;
        let facingMode = 'user'; // 'user' 前置, 'environment' 后置
        let webSocket = null;
        let wsReconnectTimer = null;
        let motionData = { x: 0, y: 0, z: 9.81 };
        let uploadedFiles = [];
        let motionPermissionGranted = false;

        // ---------- DOM 元素 ----------
        const previewVideo = document.getElementById('previewVideo');
        const videoWrap = document.getElementById('videoWrap');
        const recIndicator = document.getElementById('recIndicator');
        const timerDisplay = document.getElementById('timerDisplay');
        const btnRecord = document.getElementById('btnRecord');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnSnapshot = document.getElementById('btnSnapshot');
        const btnUploadAll = document.getElementById('btnUploadAll');
        const btnRefreshList = document.getElementById('btnRefreshList');
        const connectionDot = document.getElementById('connectionDot');
        const connectionText = document.getElementById('connectionText');
        const uploadList = document.getElementById('uploadList');
        const toast = document.getElementById('toast');
        const motionBadge = document.getElementById('motionBadge');
        const motionStatus = document.getElementById('motionStatus');
        const cameraCard = document.getElementById('cameraCard');

        // ---------- Toast 通知 ----------
        let toastTimeout;

        function showToast(message, type = '') {
            clearTimeout(toastTimeout);
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        // ---------- WebSocket 连接 ----------
        function connectWebSocket() {
            if (webSocket && webSocket.readyState === WebSocket.OPEN) return;

            try {
                webSocket = new WebSocket(WS_URL);
                webSocket.onopen = () => {
                    console.log('🔗 WebSocket 已连接');
                    setConnectionStatus(true);
                    if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
                    // 发送设备信息
                    sendWSMessage({
                        type: 'device_info',
                        device: 'phone',
                        userAgent: navigator.userAgent,
                        screenWidth: screen.width,
                        screenHeight: screen.height
                    });
                };
                webSocket.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        handleWSMessage(msg);
                    } catch (e) {
                        console.log('WS消息:', event.data);
                    }
                };
                webSocket.onclose = () => {
                    console.log('🔌 WebSocket 断开');
                    setConnectionStatus(false);
                    scheduleWSReconnect();
                };
                webSocket.onerror = () => {
                    console.log('⚠️ WebSocket 错误');
                    setConnectionStatus(false);
                };
            } catch (e) {
                console.log('WebSocket 创建失败:', e);
                setConnectionStatus(false);
                scheduleWSReconnect();
            }
        }

        function scheduleWSReconnect() {
            if (wsReconnectTimer) clearTimeout(wsReconnectTimer);
            wsReconnectTimer = setTimeout(() => {
                console.log('🔄 尝试重新连接 WebSocket...');
                connectWebSocket();
            }, 3000);
        }

        function sendWSMessage(data) {
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                webSocket.send(JSON.stringify(data));
            }
        }

        function handleWSMessage(msg) {
            switch (msg.type) {
                case 'remote_record_start':
                    if (!isRecording) startRecording();
                    break;
                case 'remote_record_stop':
                    if (isRecording) stopRecording();
                    break;
                case 'remote_snapshot':
                    takeSnapshot();
                    break;
                case 'upload_complete':
                    showToast('✅ 视频已上传到 Bilibili!', 'success');
                    refreshUploadList();
                    break;
                case 'upload_error':
                    showToast('❌ 上传失败: ' + (msg.error || '未知错误'), 'error');
                    break;
                case 'pong':
                    // 心跳响应
                    break;
                default:
                    console.log('收到消息:', msg);
            }
        }

        function setConnectionStatus(connected) {
            if (connected) {
                connectionDot.classList.add('connected');
                connectionText.textContent = '已连接';
            } else {
                connectionDot.classList.remove('connected');
                connectionText.textContent = '未连接';
            }
        }

        // ---------- 摄像头 & 麦克风 ----------
        async function initCamera() {
            try {
                if (mediaStream) {
                    mediaStream.getTracks().forEach(t => t.stop());
                }
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                };
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                previewVideo.srcObject = mediaStream;
                await previewVideo.play();
                console.log('📷 摄像头+麦克风已就绪, facing:', facingMode);
                showToast('📷 Air Camera & Air Mic 已就绪', 'success');
            } catch (err) {
                console.error('摄像头/麦克风访问失败:', err);
                showToast('⚠️ 无法访问摄像头/麦克风，请授权', 'error');
                // 尝试仅音频
                try {
                    const audioOnly = { audio: true };
                    mediaStream = await navigator.mediaDevices.getUserMedia(audioOnly);
                    previewVideo.srcObject = null;
                    showToast('🎤 仅音频模式 (无摄像头)', 'success');
                } catch (e2) {
                    showToast('❌ 无法访问任何媒体设备', 'error');
                }
            }
        }

        async function switchCamera() {
            facingMode = facingMode === 'user' ? 'environment' : 'user';
            if (isRecording) {
                showToast('⚠️ 录制中无法切换摄像头，请先停止', 'error');
                facingMode = facingMode === 'user' ? 'environment' : 'user'; // 恢复
                return;
            }
            await initCamera();
            showToast(facingMode === 'user' ? '📱 前置摄像头' : '🌍 后置摄像头', 'success');
        }

        function takeSnapshot() {
            if (!mediaStream || !previewVideo.srcObject) {
                showToast('⚠️ 请先启动摄像头', 'error');
                return;
            }
            const canvas = document.createElement('canvas');
            canvas.width = previewVideo.videoWidth || 1280;
            canvas.height = previewVideo.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(previewVideo, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            // 发送快照到服务器
            sendWSMessage({
                type: 'snapshot',
                image: dataUrl,
                timestamp: Date.now()
            });
            // 同时尝试通过HTTP发送
            fetch(API_BASE + '/snapshot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: dataUrl, timestamp: Date.now() })
                })
                .then(() => showToast('📸 快照已发送到电脑', 'success'))
                .catch(() => {
                    // WebSocket已发送，静默处理
                    showToast('📸 快照已捕获', 'success');
                });
            // 闪光效果
            videoWrap.style.boxShadow = '0 0 60px rgba(255,255,255,0.7)';
            setTimeout(() => { videoWrap.style.boxShadow = ''; }, 200);
        }

        // ---------- 录制 ----------
        function startRecording() {
            if (!mediaStream) {
                showToast('⚠️ 请先启动摄像头', 'error');
                initCamera().then(() => {
                    if (mediaStream) startRecordingInternal();
                });
                return;
            }
            startRecordingInternal();
        }

        function startRecordingInternal() {
            if (isRecording) return;
            recordedChunks = [];
            const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ?
                'video/webm;codecs=vp9' :
                MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ?
                'video/webm;codecs=vp8' :
                'video/webm';
            try {
                mediaRecorder = new MediaRecorder(mediaStream, {
                    mimeType: mimeType,
                    videoBitsPerSecond: 2500000,
                    audioBitsPerSecond: 128000
                });
            } catch (e) {
                mediaRecorder = new MediaRecorder(mediaStream);
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/webm' });
                recordedChunks = [];
                uploadRecording(blob);
            };

            mediaRecorder.start(1000); // 每秒产生一个chunk
            isRecording = true;
            recordingStartTime = Date.now();
            updateUIForRecording(true);
            startTimer();
            sendWSMessage({ type: 'recording_started', timestamp: Date.now() });
            console.log('🔴 录制开始');
        }

        function stopRecording() {
            if (!isRecording || !mediaRecorder) return;
            mediaRecorder.stop();
            isRecording = false;
            updateUIForRecording(false);
            stopTimer();
            sendWSMessage({ type: 'recording_stopped', timestamp: Date.now() });
            console.log('⏹️ 录制停止');
        }

        function updateUIForRecording(recording) {
            if (recording) {
                videoWrap.classList.add('recording');
                recIndicator.classList.add('active');
                timerDisplay.classList.add('active');
                btnRecord.classList.add('recording');
                btnRecord.innerHTML = '⏹️ 停止录制';
                cameraCard.classList.add('active-recording');
            } else {
                videoWrap.classList.remove('recording');
                recIndicator.classList.remove('active');
                timerDisplay.classList.remove('active');
                btnRecord.classList.remove('recording');
                btnRecord.innerHTML = '⏺️ 开始录制';
                cameraCard.classList.remove('active-recording');
            }
        }

        function startTimer() {
            stopTimer();
            timerInterval = setInterval(() => {
                const elapsed = Date.now() - recordingStartTime;
                const sec = Math.floor(elapsed / 1000);
                const min = Math.floor(sec / 60);
                const s = sec % 60;
                timerDisplay.textContent =
                    String(min).padStart(2, '0') + ':' + String(s).padStart(2, '0');
            }, 200);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = null;
            timerDisplay.textContent = '00:00';
        }

        // ---------- 上传录制文件到电脑 ----------
        async function uploadRecording(blob) {
            const filename = 'air_record_' + new Date().toISOString().replace(/[:.]/g, '-') + '.webm';
            const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
            showToast(`📦 正在上传 ${sizeMB}MB 到电脑...`, 'success');

            const formData = new FormData();
            formData.append('video', blob, filename);
            formData.append('motion_data', JSON.stringify(motionData));
            formData.append('recorded_at', new Date().toISOString());

            try {
                const response = await fetch(API_BASE + '/upload_recording', {
                    method: 'POST',
                    body: formData,
                });
                if (response.ok) {
                    const result = await response.json();
                    showToast(`✅ 上传成功! ${sizeMB}MB`, 'success');
                    refreshUploadList();
                    sendWSMessage({ type: 'upload_complete_local', filename: filename, size: blob.size });
                } else {
                    throw new Error('服务器响应错误: ' + response.status);
                }
            } catch (err) {
                console.error('上传失败:', err);
                showToast('❌ 上传失败，请检查电脑连接', 'error');
                // 保存到本地作为备份
                saveLocally(blob, filename);
            }
        }

        function saveLocally(blob, filename) {
            try {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('💾 已保存到手机本地', 'success');
            } catch (e) {
                showToast('❌ 本地保存也失败了', 'error');
            }
        }

        // ---------- 刷新上传列表 ----------
        async function refreshUploadList() {
            try {
                const response = await fetch(API_BASE + '/recordings');
                if (response.ok) {
                    const data = await response.json();
                    uploadedFiles = data.files || [];
                    renderUploadList();
                }
            } catch (err) {
                console.log('获取列表失败 (服务器可能未运行):', err.message);
                // 静默处理
            }
        }

        function renderUploadList() {
            if (uploadedFiles.length === 0) {
                uploadList.innerHTML =
                    '<div style="color:var(--text2);text-align:center;padding:20px;font-size:0.8rem;">暂无录制文件<br>开始录制后视频将出现在这里</div>';
                btnUploadAll.disabled = true;
                return;
            }
            btnUploadAll.disabled = false;
            uploadList.innerHTML = uploadedFiles.map((f, i) => {
                const sizeMB = (f.size / 1024 / 1024).toFixed(1);
                const statusClass = f.uploaded_to_bilibili ? 'status-done' :
                    f.uploading ? 'status-uploading' : 'status-ready';
                const statusText = f.uploaded_to_bilibili ? '已发布' : f.uploading ? '上传中' : '待发布';
                return `
                    <div class="upload-item">
                        <span class="upload-name" title="${f.name}">🎬 ${f.name}</span>
                        <span class="upload-size">${sizeMB}MB</span>
                        <span class="upload-status ${statusClass}">${statusText}</span>
                        <button class="btn btn-secondary btn-sm" 
                                onclick="uploadSingleToBilibili('${f.name}')" 
                                ${f.uploaded_to_bilibili || f.uploading ? 'disabled' : ''}>
                            📤
                        </button>
                    </div>`;
            }).join('');
        }

        async function uploadSingleToBilibili(filename) {
            showToast('🚀 正在发布到 Bilibili...', 'success');
            try {
                const response = await fetch(API_BASE + '/upload_to_bilibili', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: filename,
                        title: 'Air Studio 录制 - ' + new Date().toLocaleDateString('zh-CN'),
                        desc: '通过 Air Studio 空中工作室录制',
                        tags: ['生活记录', 'AirStudio', '日常']
                    })
                });
                if (response.ok) {
                    const result = await response.json();
                    showToast('✅ 已提交到 Bilibili! BVID: ' + (result.bvid || '处理中'), 'success');
                    refreshUploadList();
                } else {
                    const errData = await response.json().catch(() => ({}));
                    showToast('❌ 发布失败: ' + (errData.error || '未知错误'), 'error');
                }
            } catch (err) {
                showToast('❌ 网络错误，请检查电脑连接', 'error');
            }
        }

        async function uploadAllToBilibili() {
            const pending = uploadedFiles.filter(f => !f.uploaded_to_bilibili && !f.uploading);
            if (pending.length === 0) {
                showToast('没有待发布的视频', 'error');
                return;
            }
            showToast(`🚀 正在发布 ${pending.length} 个视频...`, 'success');
            for (const f of pending) {
                await uploadSingleToBilibili(f.name);
                await new Promise(r => setTimeout(r, 1500));
            }
        }

        // ---------- Air Motion: 设备运动传感器 ----------
        function initMotionSensors() {
            // DeviceMotionEvent
            if (typeof DeviceMotionEvent !== 'undefined') {
                // iOS 13+ 需要权限请求
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    motionStatus.textContent = '📱 点击此处启用动作感应';
                    motionStatus.style.cursor = 'pointer';
                    motionStatus.style.textDecoration = 'underline';
                    motionStatus.onclick = async () => {
                        try {
                            const permission = await DeviceMotionEvent.requestPermission();
                            if (permission === 'granted') {
                                motionPermissionGranted = true;
                                startMotionListening();
                                motionStatus.textContent = '📱 设备运动数据实时监测中';
                                motionStatus.style.cursor = 'default';
                                motionStatus.style.textDecoration = 'none';
                                motionStatus.onclick = null;
                            } else {
                                motionStatus.textContent = '⚠️ 动作感应权限被拒绝';
                            }
                        } catch (err) {
                            console.log('Motion permission error:', err);
                            motionStatus.textContent = '⚠️ 权限请求失败';
                        }
                    };
                } else {
                    // Android 或旧版 iOS
                    motionPermissionGranted = true;
                    startMotionListening();
                }
            } else {
                motionStatus.textContent = '⚠️ 此设备不支持动作感应';
                motionBadge.style.display = 'none';
            }

            // DeviceOrientationEvent 作为补充
            if (typeof DeviceOrientationEvent !== 'undefined') {
                window.addEventListener('deviceorientation', (event) => {
                    if (!motionPermissionGranted) return;
                    // alpha: 罗盘方向, beta: 前后倾斜, gamma: 左右倾斜
                    const alpha = event.alpha || 0;
                    const beta = event.beta || 0;
                    const gamma = event.gamma || 0;
                    // 融合到motionData
                    motionData.alpha = alpha;
                    motionData.beta = beta;
                    motionData.gamma = gamma;
                    sendWSMessage({
                        type: 'orientation',
                        alpha: alpha,
                        beta: beta,
                        gamma: gamma,
                        timestamp: Date.now()
                    });
                }, true);
            }
        }

        function startMotionListening() {
            window.addEventListener('devicemotion', (event) => {
                const acc = event.accelerationIncludingGravity;
                if (acc) {
                    motionData.x = acc.x || 0;
                    motionData.y = acc.y || 0;
                    motionData.z = acc.z || 9.81;
                    updateMotionUI(motionData.x, motionData.y, motionData.z);
                    // 节流发送
                    throttleSendMotion(motionData);
                }
            }, true);
            motionBadge.textContent = '● sensing';
            motionBadge.style.animation = 'pulse-glow-amber 1.5s ease-in-out infinite';
        }

        let lastMotionSend = 0;

        function throttleSendMotion(data) {
            const now = Date.now();
            if (now - lastMotionSend < 100) return; // 100ms 节流
            lastMotionSend = now;
            sendWSMessage({
                type: 'motion',
                x: data.x,
                y: data.y,
                z: data.z,
                alpha: data.alpha || 0,
                beta: data.beta || 0,
                gamma: data.gamma || 0,
                timestamp: now
            });
        }

        function updateMotionUI(x, y, z) {
            document.getElementById('motionX').textContent = x.toFixed(2);
            document.getElementById('motionY').textContent = y.toFixed(2);
            document.getElementById('motionZ').textContent = z.toFixed(2);

            // 归一化到 0-100% 的条形图 (假设范围 -15 到 +15)
            const normX = Math.min(100, Math.max(0, ((x + 15) / 30) * 100));
            const normY = Math.min(100, Math.max(0, ((y + 15) / 30) * 100));
            const normZ = Math.min(100, Math.max(0, ((z) / 20) * 100));
            document.getElementById('barX').style.width = normX + '%';
            document.getElementById('barY').style.width = normY + '%';
            document.getElementById('barZ').style.width = normZ + '%';
        }

        // ---------- 心跳 ----------
        function startHeartbeat() {
            setInterval(() => {
                sendWSMessage({ type: 'ping', timestamp: Date.now() });
            }, 15000);
        }

        // ---------- 事件绑定 ----------
        btnRecord.addEventListener('click', () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        btnSwitchCamera.addEventListener('click', switchCamera);
        btnSnapshot.addEventListener('click', takeSnapshot);
        btnUploadAll.addEventListener('click', uploadAllToBilibili);
        btnRefreshList.addEventListener('click', refreshUploadList);

        // 页面卸载时清理
        window.addEventListener('beforeunload', () => {
            if (isRecording) stopRecording();
            if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
            if (webSocket) webSocket.close();
        });

        // 页面隐藏时 (手机锁屏等)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isRecording) {
                console.log('⚠️ 页面隐藏，录制仍在进行');
            }
        });

        // ---------- 初始化 ----------
        async function init() {
            console.log('🌬️ Air Studio 初始化...');
            console.log('📡 服务器地址:', SERVER_URL);
            connectWebSocket();
            await initCamera();
            initMotionSensors();
            startHeartbeat();
            refreshUploadList();
            console.log('✅ Air Studio 就绪');
            console.log('   📷 Air Camera - 就绪');
            console.log('   🎤 Air Micro Phone - 就绪');
            console.log('   🌀 Air Motion - 就绪');
            showToast('🌬️ Air Studio 已就绪', 'success');
        }

        // 启动
        init().catch(err => {
            console.error('初始化失败:', err);
            showToast('⚠️ 初始化出错，请刷新页面', 'error');
        });

        // ============================================================
        console.log(`
        ╔══════════════════════════════════════╗
        ║     🌬️  Air Studio 前端已加载      ║
        ║  Air Camera    📷 视频采集         ║
        ║  Air Micro Phone 🎤 音频采集      ║
        ║  Air Motion    🌀 动作感应         ║
        ║  Bilibili Upload 📺 视频发布      ║
        ║  连接后端: ${SERVER_URL}  ║
        ╚══════════════════════════════════════╝
        `);
    </script>
</body>
